[project]
name = "napravi-plan"
version = "0.4.0"
description = "Godišnji i mesečni planovi rada nastavnika po službenom glasniku i ZUOV obrascima"
readme = "README.md"
requires-python = ">=3.11"
# Zavisnosti su u requirements.txt (njega čita Streamlit Community Cloud).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B905",  # zip() bez strict= — namerno, liste su iste dužine
    "E741",  # kratka imena (l, O) u petljama
]
